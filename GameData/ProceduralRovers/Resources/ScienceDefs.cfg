// 1. MastCam Multispektral Panoramik Görüntüleme Deneyi
EXPERIMENT_DEFINITION
{
    id = pr_mastCamPanorama
    title = Multispektral Panoramik Yüzey Görüntüsü
    baseValue = 10
    scienceCap = 10
    dataScale = 1.5

    requireAtmosphere = False
    situationMask = 5       // SrfLanded (1) + SrfSplashed (4)
    biomeMask = 5

    RESULTS
    {
        default = MastCam optikleri yüksek çözünürlüklü 360 derecelik multispektral panoramayı kaydetti. Kızılötesi bantlarda ilginç mineral yansımaları görülüyor.
        KerbinSrfLanded = Kerbin yüzeyinin panoramik görüntüsü net. Uzakta KSC binaları ve çimenlik tepeler kalibrasyon hedefi olarak mükemmel iş görüyor.
        MunSrfLanded = Mun kraterlerinin keskin gölgeleri ve gri regolit dokusu multispektral filtrelerde yüksek demir-titanyum izleri gösteriyor.
        MinmusSrfLanded = Minmus'un kristalize nane yeşili düzlükleri UV ve IR spektrumunda alışılmadık derecede yüksek albedo yansıması veriyor.
        DunaSrfLanded = Duna'nın pas kızılı toz tabakası ve bazalt kayalıkları, geçmişteki sıvı akış yataklarına işaret eden katmanlı tortul yapılar sergiliyor.
        EveSrfLanded = Eve'in mor atmosferi altında bazaltik kayaçlar yüksek basınç ve termal aşınma izleri taşıyor.
        VallSrfLanded = Vall'ın kriyovolkanik buzul çatlakları multispektral kamerada derin mavi kırılma desenleri oluşturuyor.
    }
}

// 2. APXS Alfa Parçacık & X-Işını Spektrometri Deneyi
EXPERIMENT_DEFINITION
{
    id = pr_laserSpectrometry
    title = Alfa Parçacık X-Işını Spektrometri Analizi
    baseValue = 16
    scienceCap = 20
    dataScale = 2.0

    requireAtmosphere = False
    situationMask = 1       // Sadece SrfLanded (1)
    biomeMask = 1

    RESULTS
    {
        default = X-Işını floresans spektrometresi yüzey kayaçlarının atomik ve elementel dağılımını yüksek doğrulukla çıkardı.
        MunSrfLanded = Spektrometre verileri yüksek oranda anortozit, silikat ve mikro-meteorit çarpışmalarıyla camlaşmış regolit (agglutinate) tespit etti.
        MinmusSrfLanded = Yüzey tuzları ve donmuş hidrokarbon/sülfat bileşikleri X-ışını kırınımında belirgin pikler oluşturdu.
        DunaSrfLanded = Kayaç yüzeyinde yoğun hematit (Fe2O3), sülfat tuzları ve kil mineralleri (fillosilikatlar) saptandı!
        EelooSrfLanded = Aşırı soğuk yüzey kabuğunda su buzu, metan klatratları ve tholin benzeri organik polimer izleri ölçüldü.
    }
}

// 3. Robotik Matkap Toprak Altı Karot Numunesi Deneyi
EXPERIMENT_DEFINITION
{
    id = pr_subsurfaceCoreSample
    title = Toprak Altı Derin Karot Numunesi
    baseValue = 24
    scienceCap = 30
    dataScale = 3.0

    requireAtmosphere = False
    situationMask = 1       // Sadece SrfLanded (1)
    biomeMask = 1

    RESULTS
    {
        default = Robotik matkap yüzeyin 50 cm altından radyasyondan korunmuş bozulmamış bir silindirik kayaç karotu çıkardı.
        MunSrfLanded = Yüzey altındaki sıkışmış regolit katmanı, milyarlarca yıllık güneş rüzgarı izotoplarını (He-3) barındırıyor.
        MinmusSrfLanded = Matkap ucundan çıkan süblimleşmemiş derin buzlu çekirdek örneği, uydunun iç termal geçmişine ışık tutuyor.
        DunaSrfLanded = Yüzeydeki oksitlenmiş kırmızı tozun hemen altında, kozmik radyasyondan korunmuş gri-yeşil kil ve hidratlı mineral damarlarına ulaşıldı.
    }
}
