// ============================================================================
// Procedural Rovers - ModuleManager Uyumluluk Yamaları
// ============================================================================

// --- 1. Community Tech Tree (CTT) Uyumluluğu ---
@PART[pr_wheel_heavyDuty|pr_track_continuous]:NEEDS[CommunityTechTree]
{
    @TechRequired = advancedMotors
}

@PART[pr_payload_mmrtg]:NEEDS[CommunityTechTree]
{
    @TechRequired = nuclearPower
}

@PART[pr_payload_roboticDrill]:NEEDS[CommunityTechTree]
{
    @TechRequired = advOffworldMining
}

// --- 2. KSP Breaking Ground (SquadExpansion/Serenity) Uyumluluğu ---
@PART[pr_payload_spectrometer]:NEEDS[SquadExpansion/Serenity]
{
    MODULE
    {
        name = ModuleActiveRadiator
        maxEnergyTransfer = 250
        overcoolFactor = 0.25
        isCoreRadiator = true
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.0025
        }
    }
}

// --- 3. Kerbal EVA Envanter Kapasitesi Desteği (Katlanmış Apollo LRV Kutusunu Sırt Çantasında Taşıyabilme) ---
@PART[kerbalEVA*]:HAS[@MODULE[ModuleInventoryPart]]
{
    @MODULE[ModuleInventoryPart]
    {
        @packedVolumeLimit = 120
        @massLimit = 0.65
    }
}

// --- 4. Tekerlek ve Ekipmanların da EVA İnşa Modunda (I Tuşu) Taşınabilmesi ---
@PART[pr_wheel_*|pr_track_*|pr_payload_*]:HAS[!MODULE[ModuleCargoPart]]
{
    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 15
    }
}

// --- 5. Harici Ölçekleme / Editor Modlarının (GeneKermanScale, KSP-Recall AttachedOnEditor)
//        ProceduralRoverCore Dinamik Node Kaydırmasıyla Çakışmasını Önle ---
@PART[pr_roverCore_procedural|pr_wheel_*|pr_track_*|pr_payload_*]:FINAL
{
    !MODULE[GeneKermanScale],* {}
    !MODULE[AttachedOnEditor],* {}
    !MODULE[TweakScale],* {}
}
