PART
{
    name = pr_track_continuous
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Mobility/Assets/TrackContinuous
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    node_stack_mount = 0.28, 0.18, 0.00, 1.0, 0.0, 0.0, 1
    node_attach      = 0.28, 0.18, 0.00, 1.0, 0.0, 0.0

    attachRules = 1,1,0,0,1

    TechRequired = advancedMotors
    entryCost = 8400
    cost = 1450
    category = Ground
    subcategory = 0
    title = PR-T90 "FoundryTrack" Modüler Tırtıllı Palet Sistemi
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Dik krater yamaçları, buzul yüzeyler ve yumuşak regolit zeminler için geliştirilmiş entegre tırtıllı palet ünitesi. Diferansiyel tank dönüşü (yerinde 360 derece nokta dönüşü), gerçek zamanlı UV palet şeridi animasyonu ve çoklu makara süspansiyonuna sahiptir.

    mass = 0.145
    dragModelType = default
    maximum_drag = 0.35
    minimum_drag = 0.25
    angularDrag = 1.5
    crashTolerance = 110
    maxTemp = 2200
    skinMaxTemp = 2400

    bulkheadProfiles = srf, size1
    tags = track continuous tread tank wheel rover kerbal foundries procedural mobility

    // --- 0. KSP Temel Tekerlek/Palet Fiziği (KRİTİK: baseModuleIndex = 0 için İLK MODULE olmalıdır!) ---
    MODULE
    {
        name = ModuleWheelBase

        wheelColliderTransformName = wheelCollider
        wheelTransformName = DriveSprocket
        useNewFrictionModel = true

        wheelType = MOTORIZED

        radius = 0.38
        center = 0,0,0
        mass = 0.075
        groundHeightOffset = 0
        TooltipTitle = Tırtıllı Palet Ünitesi
        TooltipPrimaryField = Diferansiyel Tank Sürüşü & Yüksek Tırmanma Tutuşu

        frictionMultiplier = 1.65
    }

    // --- 1. Burulma Çubuklu (Torsion Bar) Palet Süspansiyonu ---
    MODULE
    {
        name = ModuleWheelSuspension
        baseModuleIndex = 0
        suspensionTransformName = suspensionTransform

        suspensionDistance = 0.22
        suspensionOffset = -0.02
        targetPosition = 0.50
        springRatio = 22.0
        damperRatio = 2.6
        boostRatio = 0.80
        useDistributedMass = true
    }

    // --- 2. Tahrik ve Diferansiyel Tank Dönüş Motoru (ModuleWheelMotorSteering) ---
    MODULE
    {
        name = ModuleWheelMotorSteering
        baseModuleIndex = 0

        wheelSpeedMax = 20
        driveResponse = 3.0
        driveOutput = 6.5
        steerResponse = 2.8

        torqueCurve
        {
            key = 0 6.5 0 0
            key = 5 5.8 0 0
            key = 12 3.2 0 0
            key = 20 0.4 0 0
            key = 22 0 0 0
        }

        steeringCurve
        {
            key = 0 1.0
            key = 10 0.65
            key = 20 0.25
        }

        RESOURCE
        {
            name = ElectricCharge
            rate = 2.60
        }
        idleDrain = 0.0
    }

    // --- 3. Hidrolik Palet Kilitleme Freni ---
    MODULE
    {
        name = ModuleWheelBrakes
        baseModuleIndex = 0

        maxBrakeTorque = 42.0
        brakeResponse = 3.5
    }

    // --- 4. Zırhlı Palet Hasar Modülü ---
    MODULE
    {
        name = ModuleWheelDamage
        baseModuleIndex = 0

        damagedTransformName = bustedTrack
        undamagedTransformName = TrackBelt_Mesh

        stressTolerance = 12000
        impactTolerance = 6500
        deflectionMagnitude = 0.25
        deflectionSharpness = 2.0
        slipMagnitude = 8
        slipSharpness = 2.0
        explodeMultiplier = 1.0
    }

    // --- 5. Prosedürel Ölçekleme ve Gezegen Tutuş Profili Modülü ---
    MODULE
    {
        name = ProceduralRoverWheel
        wheelScale = 1.0
        tractionPresetIndex = 2
        baseRadius = 0.38
        baseSuspensionDistance = 0.22
        baseSpringRatio = 22.0
        baseDamperRatio = 2.6
        baseDriveOutput = 6.5
        baseBrakeTorque = 42.0
        baseFrictionMultiplier = 1.65
        mountNodeId = mount
    }

    // --- 6. Kerbal Foundries Tarzı Palet UV Kaydırma, Makara Senkronu ve Pivot Tank Dönüş Modülü ---
    MODULE
    {
        name = ProceduralContinuousTrack
        enablePivotSteer = true
        pivotTorqueMultiplier = 1.2
        trackBeltMeshName = TrackBelt_Mesh
        driveSprocketName = DriveSprocket
        idlerWheelName = IdlerWheel
        roadWheelPrefix = RoadWheel_
        rollerRadius = 0.16
        sprocketRadius = 0.22
        idlerRadius = 0.20
        uvScrollRate = 0.85
        uvScrollAxis = Y
        maxPivotSpeed = 4.5
        basePivotForce = 6.5
    }
}
