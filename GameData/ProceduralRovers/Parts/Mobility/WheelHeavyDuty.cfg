PART
{
    name = pr_wheel_heavyDuty
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Mobility/Assets/WheelHeavyDuty
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    node_stack_mount = 0.24, 0.20, 0.00, 1.0, 0.0, 0.0, 1
    node_attach      = 0.24, 0.20, 0.00, 1.0, 0.0, 0.0

    attachRules = 1,1,0,0,1

    TechRequired = advancedMotors
    entryCost = 5800
    cost = 850
    category = Ground
    subcategory = 0
    title = PR-W50 "TitanGrip" Ağır Hizmet Alaşım/Kauçuk Tekerlek
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Ağır bilim laboratuvarları, maden sondaj rover'ları ve zırhlı keşif şasileri için tasarlanmış yüksek torklu, güçlendirilmiş kauçuk/titanyum alaşım sırtlı tekerlek. Yüksek yerçekimli gezegenlerde (Eve, Kerbin, Tylo) ve ağır yük altında çökme yapmaz.

    mass = 0.085
    dragModelType = default
    maximum_drag = 0.3
    minimum_drag = 0.2
    angularDrag = 1.0
    crashTolerance = 85
    maxTemp = 2000
    skinMaxTemp = 2200

    bulkheadProfiles = srf, size0, size1
    tags = wheel rover heavy duty rugged alloy rubber mining science procedural mobility

    // --- 0. KSP Temel Tekerlek Fiziği (KRİTİK: baseModuleIndex = 0 için İLK MODULE olmalıdır!) ---
    MODULE
    {
        name = ModuleWheelBase

        wheelColliderTransformName = wheelCollider
        wheelTransformName = wheelTransform
        useNewFrictionModel = true

        wheelType = MOTORIZED

        radius = 0.42
        center = 0,0,0
        mass = 0.045
        groundHeightOffset = 0
        TooltipTitle = Ağır Hizmet Keşif Tekerleği
        TooltipPrimaryField = Yüksek Tork & Ağır Yük Süspansiyonu

        frictionMultiplier = 1.30
    }

    // --- 1. Ağır Hizmet Hidropnömatik Süspansiyon ---
    MODULE
    {
        name = ModuleWheelSuspension
        baseModuleIndex = 0
        suspensionTransformName = suspensionTransform

        suspensionDistance = 0.24
        suspensionOffset = -0.03
        targetPosition = 0.50
        springRatio = 18.0
        damperRatio = 2.2
        boostRatio = 0.75
        useDistributedMass = true
    }

    // --- 2. Direksiyon Modülü ---
    MODULE
    {
        name = ModuleWheelSteering
        baseModuleIndex = 0
        caliperTransformName = steeringTransform

        steeringResponse = 1.8
        steeringCurve
        {
            key = 0 26
            key = 10 12
            key = 22 4.5
            key = 38 1.5
        }
    }

    // --- 3. Yüksek Torklu Planet Dişli Motor ---
    MODULE
    {
        name = ModuleWheelMotor
        baseModuleIndex = 0

        wheelSpeedMax = 34
        driveResponse = 2.5
        driveOutput = 4.2

        torqueCurve
        {
            key = 0 4.2 0 0
            key = 8 3.6 0 0
            key = 20 1.8 0 0
            key = 34 0.3 0 0
            key = 36 0 0 0
        }

        RESOURCE
        {
            name = ElectricCharge
            rate = 1.85
        }
        idleDrain = 0.0
    }

    // --- 4. Ağır Hizmet Disk Frenleri ---
    MODULE
    {
        name = ModuleWheelBrakes
        baseModuleIndex = 0

        maxBrakeTorque = 28.0
        brakeResponse = 2.5
    }

    // --- 5. Yüksek Stres Toleranslı Hasar Modülü ---
    MODULE
    {
        name = ModuleWheelDamage
        baseModuleIndex = 0

        damagedTransformName = bustedWheel
        undamagedTransformName = wheelTransform

        stressTolerance = 6500
        impactTolerance = 3800
        deflectionMagnitude = 0.5
        deflectionSharpness = 2.0
        slipMagnitude = 12
        slipSharpness = 2.0
        explodeMultiplier = 1.0
    }

    // --- 6. Prosedürel Ölçekleme ve Gezegen Tutuş Profili Modülü ---
    MODULE
    {
        name = ProceduralRoverWheel
        wheelScale = 1.0
        tractionPresetIndex = 0
        baseRadius = 0.42
        baseSuspensionDistance = 0.24
        baseSpringRatio = 18.0
        baseDamperRatio = 2.2
        baseDriveOutput = 4.2
        baseBrakeTorque = 28.0
        baseFrictionMultiplier = 1.30
        mountNodeId = mount
    }
}
