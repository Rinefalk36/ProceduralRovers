PART
{
    name = pr_wheel_meshSpring
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Mobility/Assets/WheelMeshSpring
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    // RoverCore üzerindeki wheelFL, wheelFR, wheelML, wheelMR, wheelRL, wheelRR node'larına tam oturur
    node_stack_mount = 0.18, 0.15, 0.00, 1.0, 0.0, 0.0, 1
    node_attach      = 0.18, 0.15, 0.00, 1.0, 0.0, 0.0

    // 5. parametre (allowCollision = 1) tekerlek braketinin şasi collider'ına temas ederken kırmızı yanmasını önler
    attachRules = 1,1,0,0,1

    TechRequired = fieldScience
    entryCost = 3200
    cost = 450
    category = Ground
    subcategory = 0
    title = PR-W10 "Nitinol-Mesh" Yaylı/Hasır Keşif Tekerleği
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Apollo LRV ve Mars Curiosity/Perseverance keşif araçlarından ilham alan, delinmez şekil hafızalı titanyum/nitinol tel örgü tekerlek. Düşük yerçekimli uydularda ve keskin regolit kayalıklarında yüksek esneklik ve tırmanma kabiliyeti sunar.

    mass = 0.035
    dragModelType = default
    maximum_drag = 0.25
    minimum_drag = 0.15
    angularDrag = 1.0
    crashTolerance = 45
    maxTemp = 1600
    skinMaxTemp = 1800

    bulkheadProfiles = srf, size0
    tags = wheel rover mesh spring curiosity apollo lrv procedural mobility

    // --- 0. KSP Temel Tekerlek Fiziği (KRİTİK: baseModuleIndex = 0 için İLK MODULE olmalıdır!) ---
    MODULE
    {
        name = ModuleWheelBase

        wheelColliderTransformName = wheelCollider
        wheelTransformName = wheelTransform
        useNewFrictionModel = true

        wheelType = MOTORIZED

        radius = 0.26
        center = 0,0,0
        mass = 0.020
        groundHeightOffset = 0
        TooltipTitle = Hasır/Yaylı Keşif Tekerleği
        TooltipPrimaryField = Motorlu & Yönlendirilebilir

        frictionMultiplier = 1.15
    }

    // --- 1. Süspansiyon Modülü ---
    MODULE
    {
        name = ModuleWheelSuspension
        baseModuleIndex = 0
        suspensionTransformName = suspensionTransform

        suspensionDistance = 0.16
        suspensionOffset = -0.02
        targetPosition = 0.45
        springRatio = 10.5
        damperRatio = 1.6
        boostRatio = 0.65
        useDistributedMass = true
    }

    // --- 2. Hıza Duyarlı Direksiyon Modülü ---
    MODULE
    {
        name = ModuleWheelSteering
        baseModuleIndex = 0
        caliperTransformName = steeringTransform

        steeringResponse = 2.5
        steeringCurve
        {
            key = 0 32
            key = 8 16
            key = 18 6
            key = 30 2.5
        }
    }

    // --- 3. Elektrikli Fırçasız Göbek Motoru ---
    MODULE
    {
        name = ModuleWheelMotor
        baseModuleIndex = 0

        wheelSpeedMax = 24
        driveResponse = 2.2
        driveOutput = 1.8

        torqueCurve
        {
            key = 0 1.8 0 0
            key = 6 1.5 0 0
            key = 16 0.7 0 0
            key = 24 0.15 0 0
            key = 26 0 0 0
        }

        RESOURCE
        {
            name = ElectricCharge
            rate = 0.85
        }
        idleDrain = 0.0
    }

    // --- 4. Rejeneratif / Mekanik Fren Modülü ---
    MODULE
    {
        name = ModuleWheelBrakes
        baseModuleIndex = 0

        maxBrakeTorque = 12.0
        brakeResponse = 2.0
    }

    // --- 5. Hasar ve Aşınma Modülü ---
    MODULE
    {
        name = ModuleWheelDamage
        baseModuleIndex = 0

        damagedTransformName = bustedWheel
        undamagedTransformName = wheelTransform

        stressTolerance = 1800
        impactTolerance = 950
        deflectionMagnitude = 1.0
        deflectionSharpness = 2.0
        slipMagnitude = 15
        slipSharpness = 2.0
        explodeMultiplier = 1.0
    }

    // --- 6. Prosedürel Ölçekleme ve Gezegen Tutuş Profili Modülü ---
    MODULE
    {
        name = ProceduralRoverWheel
        wheelScale = 1.0
        tractionPresetIndex = 1
        baseRadius = 0.26
        baseSuspensionDistance = 0.16
        baseSpringRatio = 10.5
        baseDamperRatio = 1.6
        baseDriveOutput = 1.8
        baseBrakeTorque = 12.0
        baseFrictionMultiplier = 1.15
        mountNodeId = mount
    }
}
