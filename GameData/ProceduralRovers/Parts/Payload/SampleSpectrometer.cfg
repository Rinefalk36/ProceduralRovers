PART
{
    name = pr_payload_spectrometer
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Payload/Assets/SampleSpectrometer
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    // RoverCore üzerindeki payloadFront, payloadTop1 veya payloadTop2 yuvasına tam oturur
    node_stack_mount = 0.00, -0.10, 0.00, 0.0, -1.0, 0.0, 0
    node_attach      = 0.00, -0.10, 0.00, 0.0, -1.0, 0.0

    attachRules = 1,1,0,0,1

    TechRequired = scienceTech
    entryCost = 6400
    cost = 1650
    category = Science
    subcategory = 0
    title = PR-X30 "APXS-Vault" Alfa Parçacık X-Işını Spektrometresi ve Numune Haznesi
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Gezegen yüzeyindeki kayaların elementel bileşimini lazer ve X-ışını floresansı ile analiz eden spektrometre ve hermetik vakumlu örnek saklama haznesi. Toplanan tüm deney verilerini ve karot tüplerini tek noktada korur.

    mass = 0.028
    dragModelType = default
    maximum_drag = 0.15
    minimum_drag = 0.10
    angularDrag = 1.0
    crashTolerance = 20
    maxTemp = 1800
    skinMaxTemp = 2000

    bulkheadProfiles = srf, size0
    tags = spectrometer apxs laser sample container science ore scanner rover procedural payload

    // --- 1. Prosedürel Ölçekleme ve Sensör Kafası Yönlendirme ---
    MODULE
    {
        name = ProceduralRoverPayload
        payloadScale = 1.0
        mountNodeId = mount
        hasTurretControl = true
        yawTransformName = SensorArm_Yaw
        pitchTransformName = SensorHead_Pitch
    }

    // --- 2. Alfa Parçacık & X-Işını Spektrometri Bilim Deneyi ---
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = pr_laserSpectrometry
        experimentActionName = X-Işını Spektrometre Analizi Yap
        resetActionName = Spektrometre Verisini Sil
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = False
        xmitDataScalar = 0.85
        dataIsCollectable = True
        collectActionName = Spektrometre Raporunu Al
        interactionRange = 1.8
        rerunnable = True
        usageReqMaskInternal = 1
        usageReqMaskExternal = 8
    }

    // --- 3. Yüksek Hassasiyetli Yüzey Cevher (Ore) Konsantrasyon Tarayıcısı ---
    MODULE
    {
        name = ModuleResourceScanner
        ScannerType = 0
        ResourceName = Ore
        MaxAbundanceAltitude = 500
        RequiresUnlock = false
    }

    // --- 4. Hermetik Vakumlu Bilim ve Karot Numunesi Saklama Haznesi ---
    MODULE
    {
        name = ModuleScienceContainer
        reviewActionName = Numune Haznesini İncele
        storeActionName = Deneyleri Hazneye Aktar
        collectActionName = Tüm Rover Verilerini Haznede Topla
        evaOnlyStorage = False
        storageRange = 2.5
        canBeTransferredToInVessel = True
        canTransferInVessel = True
        allowRepeatedSubjects = True
    }
}
