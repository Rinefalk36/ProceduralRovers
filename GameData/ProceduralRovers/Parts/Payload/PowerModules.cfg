// ============================================================================
// 1. Curiosity / Perseverance Tarzı Kanatçıklı MMRTG Nükleer Güç Ünitesi
// ============================================================================
PART
{
    name = pr_payload_mmrtg
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Payload/Assets/RoverMMRTG
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    node_stack_mount = 0.00, 0.00, -0.22, 0.0, 0.0, -1.0, 0
    node_attach      = 0.00, 0.00, -0.22, 0.0, 0.0, -1.0

    attachRules = 1,1,0,0,1

    TechRequired = experimentalElectrics
    entryCost = 24000
    cost = 11500
    category = Electrical
    subcategory = 0
    title = PR-G100 "Multi-Mission" Radyoizotop Termoelektrik Jeneratörü (MMRTG)
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Curiosity ve Perseverance şasilerinin arka bölümüne açılı olarak monte edilen radyatör kanatçıklı nükleer güç kaynağı. Güneş ışığından ve toz fırtınalarından bağımsız olarak kesintisiz elektrik (ElectricCharge) üretir.

    mass = 0.045
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 1.5
    crashTolerance = 35
    maxTemp = 2200
    skinMaxTemp = 2400

    bulkheadProfiles = srf, size0
    tags = rtg mmrtg nuclear generator electric power curiosity perseverance rover procedural payload

    // --- 1. Prosedürel Ölçekleme ve Jeneratör Çıktı Senkronizasyonu ---
    MODULE
    {
        name = ProceduralRoverPayload
        payloadScale = 1.0
        mountNodeId = mount
        hasTurretControl = false
        baseGeneratorOutput = 1.65
    }

    // --- 2. Kesintisiz Nükleer Elektrik Üretimi ---
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = true
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 1.65
        }
    }

    // --- 3. Termal Radyatör / Çekirdek Isı Dengesi ---
    MODULE
    {
        name = ModuleCoreHeat
        CoreTempGoal = 350
        CoreToPartRatio = 0.1
        CoreTempGoalAdjustment = 0
        CoreEnergyMultiplier = 0.01
        HeatRadiantMultiplier = 0.05
        CoolingRadiantMultiplier = 0
        HeatTransferMultiplier = 0
        CoolantTransferMultiplier = 0
        radiatorCoolingFactor = 0
        radiatorHeatingFactor = 0
        MaxCalculationWarp = 1000
        CoreShutdownTemp = 10000
        MaxCoolant = 0
        PassiveEnergy
        {
            key = 0 25000
            key = 200 10000
            key = 250 50
            key = 300 25
            key = 350 0
        }
    }
}

// ============================================================================
// 2. Lunokhod / Sojourner Tarzı Katlanabilir Üst Güverte Güneş Paneli
// ============================================================================
PART
{
    name = pr_payload_solarDeck
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Payload/Assets/RoverSolarDeck
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    node_stack_mount = 0.00, -0.04, 0.00, 0.0, -1.0, 0.0, 0
    node_attach      = 0.00, -0.04, 0.00, 0.0, -1.0, 0.0

    attachRules = 1,1,0,0,1

    TechRequired = advElectrics
    entryCost = 3800
    cost = 520
    category = Electrical
    subcategory = 0
    title = PR-S40 "Lunokhod-Clamshell" Katlanabilir Güverte Güneş Paneli
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Lunokhod'un açılır üst kapağından ve Sojourner'ın düz güverte panelinden ilham alan yüksek verimli fotovoltaik güneş paneli. Kapalıyken rover'ın iç termal dengesini korur, açıldığında geniş açılı güneş enerjisi toplar.

    mass = 0.018
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 1.0
    crashTolerance = 14
    maxTemp = 1400
    skinMaxTemp = 1600

    bulkheadProfiles = srf, size0
    tags = solar panel deck clamshell lunokhod sojourner electric power rover procedural payload

    // --- 1. Prosedürel Ölçekleme ve C# Kapak Açılma / Şarj Senkronizasyonu ---
    MODULE
    {
        name = ProceduralRoverPayload
        payloadScale = 1.0
        mountNodeId = mount
        hasTurretControl = false
        hasDeployableMechanism = true
        deployHingeTransformName = solarPivot
        spinningBitTransformName = 
        deployedAngleDeg = 0.0
        retractedAngleDeg = 35.0
        isMechanismDeployed = true
        baseSolarChargeRate = 3.20
    }

    // --- 2. Güneş Paneli Modülü ---
    MODULE
    {
        name = ModuleDeployableSolarPanel
        isTracking = false
        raycastTransformName = suncatcher
        pivotName = suncatcher
        isBreakable = false
        resourceName = ElectricCharge
        chargeRate = 3.20
    }
}
