PART
{
    name = pr_payload_mastCam
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Payload/Assets/MastCamPanoramic
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    // RoverCore üzerindeki mastMount veya payloadTop1 yuvasına doğrudan oturur
    node_stack_mount = 0.00, -0.25, 0.00, 0.0, -1.0, 0.0, 0
    node_attach      = 0.00, -0.25, 0.00, 0.0, -1.0, 0.0

    attachRules = 1,1,0,0,1

    TechRequired = fieldScience
    entryCost = 4600
    cost = 1100
    category = Science
    subcategory = 0
    title = PR-M10 "SuperCam" Panoramik Kamera ve Lazer Telemetri Direği (MastCam)
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = 360 derece dönebilen (Pan/Tilt) yüksek çözünürlüklü multispektral panoramik kamera, kızılötesi yüzey tarayıcı ve KerbNet anomali tespit direği. Otonom çevre tarama moduyla gezegen yüzeyindeki biyomları ve anomalileri haritalandırır.

    mass = 0.022
    dragModelType = default
    maximum_drag = 0.15
    minimum_drag = 0.10
    angularDrag = 1.0
    crashTolerance = 14
    maxTemp = 1500
    skinMaxTemp = 1700

    bulkheadProfiles = srf, size0
    tags = mastcam camera science kerbnet panorama laser curiosity perseverance rover procedural payload

    // --- 1. Prosedürel Ölçekleme ve 360° Pan/Tilt Kamera Kulesi Kontrolü ---
    MODULE
    {
        name = ProceduralRoverPayload
        payloadScale = 1.0
        mountNodeId = mount
        hasTurretControl = true
        yawTransformName = MastHead_Yaw
        pitchTransformName = MastOptics_Pitch
        autoPanScan = true
    }

    // --- 2. Multispektral Panoramik Görüntüleme Bilim Deneyi ---
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = pr_mastCamPanorama
        experimentActionName = Multispektral Panoramik Görüntü Kaydet
        resetActionName = Kamera Belleğini Temizle
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = False
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = Kamera Verilerini İndir
        interactionRange = 1.8
        rerunnable = True
        usageReqMaskInternal = 1
        usageReqMaskExternal = 8
    }

    // --- 3. Yüksek Çözünürlüklü KerbNet Yüzey, Biyom ve Kaynak Tarayıcısı ---
    MODULE
    {
        name = ModuleKerbNetAccess
        MinimumFoV = 5
        MaximumFoV = 85
        AnomalyDetection = 0.36
        RequiresAnimation = False
        DISPLAY_MODES
        {
            Mode = Terrain,#autoLOC_438839
            Mode = Biome,#autoLOC_438890
            Mode = Resource,#autoLOC_900321
        }
    }

    // --- 4. Yüzey Biyom ve Koordinat Analizörü ---
    MODULE
    {
        name = ModuleBiomeScanner
    }

    MODULE
    {
        name = ModuleGPS
    }
}
