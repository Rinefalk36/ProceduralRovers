PART
{
    name = pr_payload_roboticDrill
    module = Part
    author = ProceduralRoversTeam

    MODEL
    {
        model = ProceduralRovers/Parts/Payload/Assets/DrillRoboticArm
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    node_stack_mount = 0.00, 0.00, -0.15, 0.0, 0.0, -1.0, 0
    node_attach      = 0.00, 0.00, -0.15, 0.0, 0.0, -1.0

    attachRules = 1,1,0,0,1

    TechRequired = advScienceTech
    entryCost = 9200
    cost = 1850
    category = Utility
    subcategory = 0
    title = PR-D20 "TurretDrill" Teleskopik Robotik Kollu Sondaj ve Karot Matkabı
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Curiosity ve Perseverance keşif araçlarının ön robotik kolundan esinlenen katlanabilir mikro-sondaj ve karot alma sistemi. Hem gezegen yüzeylerinden cevher (Ore) çıkarabilir hem de derin toprak altı karot örneği alarak bilimsel deney gerçekleştirir.

    mass = 0.065
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 1.5
    crashTolerance = 18
    maxTemp = 2000
    skinMaxTemp = 2200

    bulkheadProfiles = srf, size0
    tags = drill harvester ore science sample core robotic arm rover procedural payload

    // --- 1. Prosedürel Ölçekleme, Kule Kontrolü ve C# Robotik Kol/Matkap Animasyonu ---
    MODULE
    {
        name = ProceduralRoverPayload
        payloadScale = 1.0
        mountNodeId = mount
        hasTurretControl = true
        hasDeployableMechanism = true
        yawTransformName = ArmBase_Yaw
        pitchTransformName = ArmShoulder_Pitch
        deployHingeTransformName = ArmForearm_Hinge
        spinningBitTransformName = DrillBit_Mesh
        deployedAngleDeg = 25.0
        retractedAngleDeg = -65.0
        baseDrillEfficiency = 0.45
    }

    // --- 2. Yüzey Cevher Sondajı (ModuleResourceHarvester) ---
    MODULE
    {
        name = ModuleResourceHarvester
        HarvesterType = 0
        Efficiency = 0.45
        ResourceName = Ore
        ConverterName = Yüzey Regolit Sondajı
        StartActionName = Regolit Sondajını Başlat
        StopActionName = Regolit Sondajını Durdur
        ToggleActionName = Regolit Sondajını Aç/Kapat
        ImpactTransform = ImpactTransform
        ImpactRange = 2.5
        AutoShutdown = true
        UseSpecialistBonus = true
        SpecialistEfficiencyFactor = 0.2
        SpecialistBonusBase = 0.05
        UseSpecialistHeatBonus = true
        SpecialistHeatFactor = 0.1
        ExperienceEffect = DrillSkill
        EfficiencyBonus = 1

        GeneratesHeat = true

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 3.2
        }

        TemperatureModifier
        {
            key = 0 2500
            key = 250 1500
            key = 500 500
            key = 750 50
            key = 1000 0
        }

        ThermalEfficiency
        {
            key = 0 0.1
            key = 250 0.5
            key = 500 1.0
            key = 750 0.2
            key = 1000 0
        }
    }

    // --- 3. Termal Çekirdek Yönetimi ---
    MODULE
    {
        name = ModuleCoreHeat
        CoreTempGoal = 500
        CoreToPartRatio = 0.1
        CoreTempGoalAdjustment = 0
        CoreEnergyMultiplier = 0.1
        HeatRadiantMultiplier = 0.25
        CoolingRadiantMultiplier = 0
        HeatTransferMultiplier = 0
        CoolantTransferMultiplier = 0.01
        radiatorCoolingFactor = 1
        radiatorHeatingFactor = 0.05
        MaxCalculationWarp = 1000
        CoreShutdownTemp = 1000
        MaxCoolant = 45
    }

    // --- 4. Derin Karot Numunesi Bilim Deneyi ---
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = pr_subsurfaceCoreSample
        experimentActionName = Toprak Altı Karot Numunesi Al
        resetActionName = Karot Numunesini Boşalt
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = False
        xmitDataScalar = 0.45
        dataIsCollectable = True
        collectActionName = Karot Örneğini Al
        interactionRange = 1.8
        rerunnable = True
        usageReqMaskInternal = 1
        usageReqMaskExternal = 8
    }

    // --- 5. Geçici Cevher Tampon Haznesi ---
    RESOURCE
    {
        name = Ore
        amount = 0
        maxAmount = 15
    }
}
