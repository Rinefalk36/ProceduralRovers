PART
{
    name = pr_roverCore_procedural
    module = Part
    author = ProceduralRoversTeam

    // --- Model & Ölçek Tanımı ---
    MODEL
    {
        model = ProceduralRovers/Parts/Core/Assets/RoverCoreProcedural
        scale = 1.0, 1.0, 1.0
    }
    scale = 1.0
    rescaleFactor = 1.0

    // --- Varsayılan Bağlantı Noktaları (1.0x Ölçek & Heavy Science Referansı) ---
    // Format: posX, posY, posZ, angX, angY, angZ, size
    // ProceduralRoverCore.cs bu koordinatları prefab'dan okuyup ölçek ve şasi tipine göre gerçek zamanlı kaydırır.

    // Ana Yapısal Bağlantılar (Skycrane, Decoupler, Ön/Arka tampon bağlantıları)
    node_stack_top          =  0.00,  0.325,  0.00,   0.0,  1.0,  0.0, 1
    node_stack_bottom       =  0.00, -0.325,  0.00,   0.0, -1.0,  0.0, 1
    node_stack_front        =  0.00,  0.000,  1.10,   0.0,  0.0,  1.0, 1
    node_stack_rear         =  0.00,  0.000, -1.10,   0.0,  0.0, -1.0, 1

    // 6-8 Tekerlek & Palet Bağlantı Noktaları (Sol / Sağ Simetrik)
    node_stack_wheelFL      = -0.70, -0.150,  0.85,  -1.0,  0.0,  0.0, 1
    node_stack_wheelFR      =  0.70, -0.150,  0.85,   1.0,  0.0,  0.0, 1
    node_stack_wheelML      = -0.70, -0.150,  0.00,  -1.0,  0.0,  0.0, 1
    node_stack_wheelMR      =  0.70, -0.150,  0.00,   1.0,  0.0,  0.0, 1
    node_stack_wheelML2     = -0.70, -0.150, -0.42,  -1.0,  0.0,  0.0, 1
    node_stack_wheelMR2     =  0.70, -0.150, -0.42,   1.0,  0.0,  0.0, 1
    node_stack_wheelRL      = -0.70, -0.150, -0.85,  -1.0,  0.0,  0.0, 1
    node_stack_wheelRR      =  0.70, -0.150, -0.85,   1.0,  0.0,  0.0, 1

    // Modüler Bilim ve Yardımcı Ekipman Yuvaları (MastCam, Robotik Matkap, RTG, Spektrometre)
    node_stack_mastMount    =  0.35,  0.325,  0.75,   0.0,  1.0,  0.0, 0
    node_stack_payloadTop1  =  0.00,  0.325,  0.40,   0.0,  1.0,  0.0, 0
    node_stack_payloadTop2  =  0.00,  0.325, -0.45,   0.0,  1.0,  0.0, 0
    node_stack_payloadFront =  0.00,  0.100,  1.10,   0.0,  0.0,  1.0, 0
    node_stack_payloadRear  =  0.00,  0.100, -1.10,   0.0,  0.0, -1.0, 0

    node_attach             =  0.00, -0.325,  0.00,   0.0, -1.0,  0.0

    // attachRules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
    attachRules = 1,1,1,1,1

    // --- Teknoloji Ağacı ve Editör Kategorisi ---
    TechRequired = fieldScience
    entryCost = 6800
    cost = 2400
    category = Pods
    subcategory = 0
    title = PR-C1 Prosedürel Keşif Şasisi (Procedural Rover Core)
    manufacturer = Kerbal Foundries & Procedural Robotics Division
    description = Mikro-keşif araçlarından (Sojourner) 6 tekerlekli nükleer bilim laboratuvarlarına (Curiosity/Perseverance), küvet gövdeli Lunokhod'dan fütüristik zırhlı keşif araçlarına kadar gerçek zamanlı boyutlandırılabilen entegre otonom rover ana gövdesi.

    // --- Temel Fiziksel Parametreler (ProceduralRoverCore tarafından dinamik olarak modifiye edilir) ---
    mass = 0.28
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 1.5
    crashTolerance = 22
    maxTemp = 1800
    skinMaxTemp = 2000
    breakingForce = 200
    breakingTorque = 200

    vesselType = Rover
    CrewCapacity = 0
    bulkheadProfiles = size1, srf

    tags = rover procedural chassis core curiosity perseverance sojourner lunokhod lrv wheel probe science

    // --- 1. Prosedürel Şasi ve Dinamik Node Kontrol Modülü ---
    MODULE
    {
        name = ProceduralRoverCore
        chassisIndex = 1
        lengthScale = 1.0
        widthScale = 1.0
        heightScale = 1.0
    }

    // --- 1b. 6 Tekerlekli Rocker-Bogie Diferansiyel Süspansiyon ve Kinematik Modülü ---
    MODULE
    {
        name = ProceduralRockerBogie
        enableRockerBogie = true
        bogieLinkStiffness = 1.0
        rockerLeftName = Rocker_L
        rockerRightName = Rocker_R
        bogieLeftName = Bogie_L
        bogieRightName = Bogie_R
        differentialBarName = DifferentialBar
    }

    // --- 1c. Apollo LRV (Foldable Frame) Katlanabilir Çanta/Kutu ve EVA Kurulum Modülü ---
    MODULE
    {
        name = ProceduralFoldableLRV
        requireEngineerOnEva = true
    }

    // --- 1d. Kerbal Kişisel Envanterine ve Kargo Slotlarına Konulabilme (ModuleCargoPart) ---
    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 25
    }

    // --- 2. Otonom Komuta ve Hibernasyon (Probe Core) ---
    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        hasHibernation = True
        hibernationMultiplier = 0.004
        defaultControlPointDisplayName = İleri (Sürüş)
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.04
        }
        CONTROLPOINT
        {
            name = up
            displayName = Yukarı (İniş / Skycrane)
            orientation = -90, 0, 0
        }
    }

    // --- 3. Dinamik Torklu Reaksiyon Tekerleği ---
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 1.5
        YawTorque = 1.5
        RollTorque = 1.125
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.12
        }
    }

    // --- 4. Şasiye Göre Değişen SAS Otonomi Seviyesi ---
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }

    // --- 5. Entegre Telemetri ve KerbNet Haritalama ---
    MODULE
    {
        name = ModuleKerbNetAccess
        MinimumFoV = 15
        MaximumFoV = 75
        AnomalyDetection = 0.18
        DISPLAY_MODES
        {
            Mode = Terrain,#autoLOC_438839
            Mode = Biome,#autoLOC_438890
        }
    }

    // --- 6. Dahili Veri Aktarımı (Entegre Düşük Kazançlı Anten) ---
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = INTERNAL
        packetInterval = 1.0
        packetSize = 2
        packetResourceCost = 12.0
        requiredResource = ElectricCharge
        antennaPower = 500000
        optimumRange = 250000
        packetFloor = 0.1
        packetCeiling = 5
    }

    // --- 7. Bilim Verisi Saklama Haznesi ---
    MODULE
    {
        name = ModuleScienceContainer
        reviewActionName = Depolanan Verileri İncele
        storeActionName = Bilim Verilerini Sakla
        evaOnlyStorage = True
        storageRange = 2.0
        canBeTransferredToInVessel = True
        canTransferInVessel = True
    }

    // --- 8. Dahili Batarya (Kapasitesi ProceduralRoverCore tarafından ölçeklenir) ---
    RESOURCE
    {
        name = ElectricCharge
        amount = 850
        maxAmount = 850
    }
}
